# Nginx local (notebook) — nova arquitetura de produção (04/09/2026,
# ver docs/deploy-oracle-frp-notebook.md). Substitui a versão antiga
# deste arquivo, que ainda terminava TLS aqui mesmo (VPS HostGator +
# certbot — histórico em docs/deploy-fase1.md).
#
# Cadeia completa da requisição pública:
#
#   Internet → HTTPS → Oracle Cloud VPS (Nginx público + Let's Encrypt,
#   fora deste repositório: certificado, renovação e redirecionamento
#   HTTP→HTTPS acontecem só lá) → túnel reverso FRP → este Nginx (dentro
#   do Docker do notebook, só HTTP puro) → Gunicorn.
#
# Por isso este arquivo:
#   - só escuta na porta 80 (nunca 443 — nenhum certificado é montado ou
#     servido por este Nginx, isso não é mais responsabilidade dele);
#   - não tem bloco de redirect HTTP→HTTPS nem de desafio ACME (a Oracle
#     já resolveu os dois antes da requisição chegar até aqui);
#   - REPASSA o `X-Forwarded-Proto` que a Oracle já enviou
#     (`$http_x_forwarded_proto`), em vez de recalculá-lo com `$scheme`.
#     `$scheme`, aqui, seria sempre "http" (a conexão que chega neste
#     Nginx via FRP é sempre HTTP puro, mesmo quando o público acessou
#     via HTTPS) — fixar isso incorretamente faria o Django
#     (`SECURE_PROXY_SSL_HEADER`, `config/settings/prod.py`) achar que
#     toda requisição pública é insegura, disparando redirecionamento
#     (`SECURE_SSL_REDIRECT`) em vez de servir a página.

server {
    listen 80;
    server_name estoque.locuslocacoes.com.br;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    # SEC-001 (Auditoria Geral Adversarial, 14/10/2026): `Attachment.file`
    # (PDFs de Proposta/Contrato, dados comerciais sensíveis) é o único
    # FileField de todo o projeto e vive sob attachments/ dentro de
    # /app/media — o `alias` genérico abaixo, sem esta exclusão, servia
    # esse caminho direto do disco a qualquer requisição não autenticada,
    # contornando por completo `AttachmentDownloadView`
    # (apps/crm/views.py — login + permissão + checagem de posse). Este
    # bloco não depende da ordem textual em relação ao `location /media/`
    # genérico abaixo — o Nginx sempre escolhe o `location` de prefixo
    # mais ESPECÍFICO (o mais longo que casa), não o primeiro no arquivo.
    # O `^~` serve para impedir que um `location` de regex (`~`/`~*`),
    # caso exista um casando este mesmo caminho, assuma a requisição no
    # lugar deste prefixo. Nenhum outro
    # FileField existe hoje sob /media/ (confirmado por auditoria); se um
    # novo tipo de mídia pública legítima for adicionado no futuro fora
    # de attachments/, o alias genérico abaixo continua servindo-o
    # normalmente.
    location ^~ /media/attachments/ {
        return 404;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
