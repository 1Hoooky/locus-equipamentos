# Configuração mínima de produção. Ajustar `server_name` se o
# subdomínio final for diferente de estoque.locuslocacoes.com.br
# (especificação, seção 22 — decisão final, ainda trocável via DNS).

server {
    listen 80;
    server_name estoque.locuslocacoes.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name estoque.locuslocacoes.com.br;

    ssl_certificate     /etc/letsencrypt/live/estoque.locuslocacoes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estoque.locuslocacoes.com.br/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
