{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
  {% if validlink %}
    <h1 class="text-xl font-semibold mb-4">Defina sua nova senha</h1>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">{{ form.new_password1 }}</div>
      <div class="mb-4">{{ form.new_password2 }}</div>
      <button type="submit" class="w-full bg-blue-600 text-white rounded-md py-2 text-sm font-medium hover:bg-blue-700">
        Salvar nova senha
      </button>
    </form>
  {% else %}
    <p class="text-sm text-red-600">Este link de redefinição não é mais válido.</p>
  {% endif %}
</div>
{% endblock %}
