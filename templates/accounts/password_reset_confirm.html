{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 card-pad">
  {% if validlink %}
    <h1 class="page-title mb-4">Defina sua nova senha</h1>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="field-label" for="{{ form.new_password1.id_for_label }}">Nova senha</label>
        <input type="password" name="{{ form.new_password1.html_name }}" id="{{ form.new_password1.id_for_label }}"
               class="field-input" autocomplete="new-password" required>
      </div>
      <div class="mb-4">
        <label class="field-label" for="{{ form.new_password2.id_for_label }}">Confirme a nova senha</label>
        <input type="password" name="{{ form.new_password2.html_name }}" id="{{ form.new_password2.id_for_label }}"
               class="field-input" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-primary w-full">
        Salvar nova senha
      </button>
    </form>
  {% else %}
    <p class="field-error">Este link de redefinição não é mais válido.</p>
  {% endif %}
</div>
{% endblock %}
