{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 card-pad">
  <h1 class="page-title mb-4">Redefinir senha</h1>
  <p class="text-sm text-gray-600 mb-4">Informe seu e-mail — enviaremos um link para redefinir sua senha.</p>
  <form method="post">
    {% csrf_token %}
    <label class="field-label" for="{{ form.email.id_for_label }}">E-mail</label>
    <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}" class="field-input"
           value="{{ form.email.value|default_if_none:'' }}" autocomplete="email" required>
    <button type="submit" class="btn-primary w-full mt-4">
      Enviar
    </button>
  </form>
</div>
{% endblock %}
