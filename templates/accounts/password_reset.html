{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
  <h1 class="text-xl font-semibold mb-4">Redefinir senha</h1>
  <p class="text-sm text-gray-600 mb-4">Informe seu e-mail — enviaremos um link para redefinir sua senha.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email }}
    <button type="submit" class="w-full mt-4 bg-blue-600 text-white rounded-md py-2 text-sm font-medium hover:bg-blue-700">
      Enviar
    </button>
  </form>
</div>
{% endblock %}
