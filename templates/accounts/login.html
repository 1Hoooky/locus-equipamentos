{% extends "base.html" %}
{% block title %}Entrar — Locus Equipamentos{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
  <h1 class="text-xl font-semibold mb-4">Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p class="text-sm text-red-600 mb-3">Usuário ou senha inválidos.</p>
    {% endif %}
    <div class="mb-3">
      <label class="block text-sm text-gray-600 mb-1" for="{{ form.username.id_for_label }}">Usuário</label>
      {{ form.username }}
    </div>
    <div class="mb-4">
      <label class="block text-sm text-gray-600 mb-1" for="{{ form.password.id_for_label }}">Senha</label>
      {{ form.password }}
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white rounded-md py-2 text-sm font-medium hover:bg-blue-700">
      Entrar
    </button>
  </form>
  <a href="{% url 'accounts:password_reset' %}" class="block text-center text-sm text-blue-600 mt-4 hover:underline">
    Esqueci minha senha
  </a>
</div>
{% endblock %}
