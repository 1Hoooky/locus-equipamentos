<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  /*
    Etiqueta "nova"/simplificada — nome de arquivo/classe "square"
    herdado de quando o formato era literalmente quadrado (60x60mm,
    08/09/2026); a partir da rodada de padronização física, o canvas
    passou a ser o adesivo real da Locus: `label_width_mm` ×
    `label_height_mm` (60×40mm, vem do Python —
    apps/qrcodes/services.py::SIMPLE_LABEL_WIDTH_MM/
    SIMPLE_LABEL_HEIGHT_MM — nunca fixo aqui).

    Conteúdo, de cima para baixo (ordem trocada nesta rodada — antes o QR
    vinha primeiro; o pedido de padronização física pede "código do
    modelo centralizado no topo" antes do QR), sem nenhum título/rótulo
    antes de cada linha (ajuste visual de 08/09/2026 — "NI23BT", nunca
    "Código do modelo: NI23BT"):
      1. Código do modelo (`model.code`, ex. "NI23BT") — negrito.
      2. QR Code — elemento visual PRINCIPAL, centralizado horizontalmente.
      3. Identificador legado — menor, ainda bem legível; linha omitida
         por completo quando o equipamento não tem um (nunca um
         traço/placeholder).
    Sem logo, sem patrimônio, sem código de barras, sem URL escrita.

    Layout SEMPRE em coluna única, vertical, centralizado — nunca duas
    colunas (isso é próprio da etiqueta ANTIGA/completa, ver
    templates/qrcodes/label.html, intocada por esta mudança). O bloco
    inteiro (`.label`) é centralizado verticalmente dentro do canvas
    (`justify-content: center`) — quando não há identificador legado, o
    espaço que sobra se redistribui de forma equilibrada ao redor do
    conjunto código+QR, em vez de deixar uma "sobra" presa embaixo.

    Uma página por etiqueta, no tamanho físico exato — mesmo raciocínio
    de templates/qrcodes/label.html: é o formato que serviços de
    gráfica/impressão de etiqueta esperam.
  */
  @page {
    size: {{ label_width_mm }}mm {{ label_height_mm }}mm;
    margin: 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DejaVu Sans", Arial, sans-serif;
    background: #fff;
  }

  .label {
    width: {{ label_width_mm }}mm;
    height: {{ label_height_mm }}mm;
    padding: 1mm 3mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Centraliza o conjunto verticalmente — é o que absorve a diferença
       de altura entre "com legado" e "sem legado" sem mudar o tamanho do
       QR (fixo, ver `.qr-image` abaixo) nem deixar espaço vazio preso
       numa borda só. */
    justify-content: center;
    page-break-after: always;
    overflow: hidden;
  }

  /*
    Código do modelo — agora a PRIMEIRA linha (pedido de padronização
    física: "código do modelo centralizado no topo"), nunca o nome
    comercial/descritivo (ver `_square_label_context` em
    apps/qrcodes/services.py). Negrito, sem rótulo/título antes.
  */
  .model-code {
    /*
      `width` explícito (não só `max-width`) — dentro do `.label` em
      flex column com `align-items: center`, um parágrafo sem largura
      fixa vira "shrink-to-fit" e o WeasyPrint não aplica
      `text-overflow: ellipsis` de forma confiável (testado: um
      `model.code` de 20 caracteres — o máximo permitido pelo cadastro,
      ver CODE_VALIDATOR em apps/catalog/models.py — extrapolava a
      largura inteira do adesivo em vez de truncar). `width: 92%` força
      o cálculo de overflow a acontecer de verdade.
    */
    display: block;
    width: 92%;
    margin: 0 0 0.8mm 0;
    font-size: 11pt;
    font-weight: bold;
    letter-spacing: 0.2pt;
    line-height: 1.05;
    text-align: center;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /*
    Wrapper do QR: SEMPRE fundo branco, nos dois temas — nunca invertido
    por estética (pedido explícito: "priorize confiabilidade de
    leitura"). No tema LIGHT isto já é redundante com o fundo da página
    (branco), mas manter a regra incondicional (em vez de só dentro de
    `body.theme-dark`) é o que garante que o QR nunca fica sem essa
    "ilha" branca, mesmo que o tema geral mude no futuro. O padding aqui
    é a margem/quiet zone visual ao redor do QR, além da quiet zone que
    a própria imagem do QR já embute (biblioteca `qrcode`, borda padrão
    de 4 módulos).
  */
  .qr-wrap {
    background: #fff;
    padding: 0.7mm;
    border-radius: 1mm;
    flex: 0 0 auto;
  }
  .qr-image {
    display: block;
    /*
      Tamanho FIXO (`qr_size_mm`, apps/qrcodes/services.py::
      SIMPLE_LABEL_QR_SIZE_MM) — o mesmo com ou sem identificador legado,
      auditado/medido fisicamente no PDF real (WeasyPrint + pdfplumber,
      não "no olho") como o maior que cabe sem colidir com o texto no
      cenário mais apertado (com legado). Fixo nos dois casos de
      propósito: evita que a etiqueta tenha dois "pesos" visuais
      diferentes para o mesmo formato — só o espaço livre ao redor
      (`.label { justify-content: center }` acima) se redistribui.
    */
    width: {{ qr_size_mm }}mm;
    height: {{ qr_size_mm }}mm;
    object-fit: contain;
    image-rendering: pixelated;
  }

  /*
    Identificador legado — menor que o código do modelo, mas ainda
    "perfeitamente legível na impressão real" (pedido explícito). Linha
    inteira omitida (condicional mais abaixo, no HTML do corpo) quando
    vazio — nunca um traço/placeholder.
  */
  .legacy-code {
    /* Mesmo raciocínio de `.model-code` acima: `width` explícito, não
       só `max-width`, para o truncamento por reticências funcionar de
       verdade dentro do flex column. */
    display: block;
    width: 92%;
    margin: 0.8mm 0 0 0;
    font-size: 7.5pt;
    line-height: 1.05;
    text-align: center;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /*
    Tema DARK: fundo escuro, textos claros. QR NUNCA é invertido —
    continua preto sobre a "ilha" branca de `.qr-wrap` acima (regra
    incondicional, já vale nos dois temas), só para garantir leitura
    confiável por leitor/impressora — mesmo numa "etiqueta escura da
    Locus" (pedido explícito), a estética nunca compromete o scanner.
  */
  body.theme-dark {
    background: #0a0a0a;
  }
  body.theme-dark .model-code,
  body.theme-dark .legacy-code {
    color: #fff;
  }
</style>
</head>
<body{% if theme == "dark" %} class="theme-dark"{% endif %}>
  {% for label in labels %}
  <div class="label">
    <p class="model-code">{{ label.model_code }}</p>
    <div class="qr-wrap">
      <img class="qr-image" src="{{ label.qr_data_uri }}" alt="QR Code {{ label.model_code }}">
    </div>
    {% if label.legacy_code %}<p class="legacy-code">{{ label.legacy_code }}</p>{% endif %}
  </div>
  {% endfor %}
</body>
</html>
