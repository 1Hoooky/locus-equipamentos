<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  /*
    Etiqueta 6x6 ("padrão novo" — correção de requisito de 08/09/2026):
    quadrada, `label_size_mm` x `label_size_mm` (60x60mm por padrão, vem
    do Python — apps/qrcodes/services.py::SQUARE_LABEL_SIZE_MM — nunca
    fixo aqui). Conteúdo, de cima para baixo: QR Code (com margem/quiet
    zone adequada), nome do equipamento, identificador legado — só isso,
    nesta ordem, por instrução explícita. Sem logo, sem patrimônio, sem
    código de barras, sem URL escrita, sem título.

    Uma página por etiqueta, no tamanho físico exato — mesmo raciocínio
    de templates/qrcodes/label.html (a etiqueta ANTIGA, intocada por
    esta mudança): é o formato que serviços de gráfica/impressão de
    etiqueta esperam.
  */
  @page {
    size: {{ label_size_mm }}mm {{ label_size_mm }}mm;
    margin: 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DejaVu Sans", Arial, sans-serif;
    background: #fff;
  }

  .label {
    width: {{ label_size_mm }}mm;
    height: {{ label_size_mm }}mm;
    padding: 3mm 3mm 3mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* QR "na parte superior" (pedido explícito) — a pilha fica ancorada
       no topo, não centralizada verticalmente no quadrado inteiro. */
    justify-content: flex-start;
    page-break-after: always;
    overflow: hidden;
  }

  /*
    Wrapper do QR: SEMPRE fundo branco, nos dois temas — nunca invertido
    por estética (pedido explícito: "priorize leitura confiável"). No
    tema LIGHT isto já é redundante com o fundo da página (branco), mas
    manter a regra incondicional (em vez de só dentro de
    `body.theme-dark`) é o que garante que o QR nunca fica sem essa
    "ilha" branca, mesmo que o tema geral mude no futuro. O padding aqui
    é a margem/quiet zone visual pedida ao redor do QR, além da quiet
    zone que a própria imagem do QR já embute (biblioteca `qrcode`,
    borda padrão de 4 módulos).
  */
  .qr-wrap {
    background: #fff;
    padding: 1.5mm;
    border-radius: 1mm;
    flex: 0 0 auto;
  }
  .qr-image {
    display: block;
    width: 38mm;
    height: 38mm;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .equipment-name {
    margin: 2mm 0 0 0;
    font-size: 9pt;
    font-weight: bold;
    line-height: 1.15;
    text-align: center;
    color: #000;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .legacy-code {
    margin: 1mm 0 0 0;
    font-size: 7.5pt;
    line-height: 1.15;
    text-align: center;
    color: #000;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /*
    Tema DARK (pedido de 08/09/2026): fundo escuro, textos claros. QR
    NUNCA é invertido — continua preto sobre a "ilha" branca de
    `.qr-wrap` acima (regra incondicional, já vale nos dois temas), só
    para garantir leitura confiável por leitor/impressora.
  */
  body.theme-dark {
    background: #0a0a0a;
  }
  body.theme-dark .equipment-name,
  body.theme-dark .legacy-code {
    color: #fff;
  }
</style>
</head>
<body{% if theme == "dark" %} class="theme-dark"{% endif %}>
  {% for label in labels %}
  <div class="label">
    <div class="qr-wrap">
      <img class="qr-image" src="{{ label.qr_data_uri }}" alt="QR Code {{ label.model_name }}">
    </div>
    <p class="equipment-name">{{ label.model_name }}</p>
    {% if label.legacy_code %}<p class="legacy-code">{{ label.legacy_code }}</p>{% endif %}
  </div>
  {% endfor %}
</body>
</html>
