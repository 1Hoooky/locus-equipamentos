<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  /*
    Etiqueta "antiga"/completa — REDESENHADA nesta rodada para o padrão
    físico único de adesivo da Locus: `label_width_mm` × `label_height_mm`
    (60×40mm, vem de apps/qrcodes/services.py::LABEL_WIDTH_MM/
    LABEL_HEIGHT_MM — nunca fixo aqui). Antes era 100×50mm; a proporção e
    o espaço disponível mudaram o bastante para exigir uma reorganização
    real do conteúdo, não um `transform: scale()`/encolhimento cego do
    layout antigo (pedido explícito — ver docs/apps/qrcodes.md para a
    justificativa completa de cada corte).

    Prioridade de legibilidade usada para decidir o que cabe (pedido
    explícito, da mais para a menos importante):
      1. QR Code legível         -> mantido grande, metade direita.
      2. Patrimônio legível      -> mantido, texto grande, metade esquerda.
      3. Código de barras usável -> mantido, mesma metade esquerda.
      4. Identidade visual       -> reduzida (só o wordmark "LOCUS"; sem
                                     subtítulo/linha divisória/tagline).
      5. Informações secundárias -> CORTADAS: o rodapé com o site
                                     institucional (`LABEL_FOOTER_TEXT`,
                                     puramente decorativo/marketing) foi
                                     removido para devolver aquele espaço
                                     vertical ao código de barras e ao
                                     patrimônio, que são funcionais.

    Estrutura preservada: duas metades lado a lado (identidade+patrimônio
    à esquerda, QR à direita, mesmo espírito do layout de 100×50mm) — o
    pedido não proíbe duas colunas para ESTE formato (só proíbe para a
    etiqueta simplificada, ver templates/qrcodes/label_square.html), e é
    a divisão que melhor preserva "QR grande à direita, identificação à
    esquerda" com o mínimo de reorganização cega.
  */
  @page {
    size: {{ label_width_mm }}mm {{ label_height_mm }}mm;
    margin: 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DejaVu Sans", Arial, sans-serif;
  }

  :root {
    --locus-yellow: #F5C518;
    --locus-black: #111111;
  }

  .label {
    width: {{ label_width_mm }}mm;
    height: {{ label_height_mm }}mm;
    display: flex;
    page-break-after: always;
    overflow: hidden;
    border: 0.4mm solid #000;
    border-radius: 1.5mm;
  }

  /*
    Metade esquerda (identidade + patrimônio): 50% da largura — a divisão
    50/50 (em vez dos 52/48 do layout de 100×50mm) é o que sobra espaço
    suficiente para o QR ficar quase quadrado (30×40mm) nesta largura
    menor, sem espremer o código de barras/patrimônio a ponto de ficarem
    ilegíveis. Medido/ajustado fisicamente no PDF real — ver
    docs/apps/qrcodes.md.
  */
  .id-half {
    width: 50%;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .brand-block {
    background: var(--locus-black);
    color: #fff;
    padding: 1mm 2mm;
    /*
      Bloco de marca REDUZIDO ao mínimo reconhecível — só o wordmark
      "LOCUS" (sem subtítulo "Locações", sem linha divisória amarela, sem
      tagline "IDENTIFICAÇÃO DE EQUIPAMENTO", todos removidos nesta
      rodada): no canvas de 40mm de altura, cada um desses elementos
      decorativos competia diretamente por espaço com o código de barras
      e o patrimônio (prioridades 2 e 3, acima da identidade visual na
      ordem pedida). Fundo dimensionado pelo próprio conteúdo (flex: 0 0
      auto), como antes — nunca uma porcentagem fixa da altura.
    */
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-wordmark {
    font-size: 13pt;
    font-weight: bold;
    color: var(--locus-yellow);
    letter-spacing: 0.2pt;
    line-height: 1;
    margin: 0;
    white-space: nowrap;
  }

  .identity-block {
    /* Todo o espaço restante da área esquerda depois do bloco de marca
       — sem rodapé para disputar espaço (removido, ver comentário do
       topo), este bloco tem bem mais respiro que no layout de 100×50mm. */
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    padding: 0.75mm 2mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 0;
    overflow: hidden;
  }
  .identity-barcode-wrap {
    /*
      Isolado num wrapper próprio (em vez de aplicar a largura direto na
      <img>) só para que o tema DARK abaixo possa desenhar uma "ilha"
      branca atrás do código de barras sem mexer no dimensionamento em
      si — no tema LIGHT este wrapper não tem nenhum estilo próprio.
    */
    display: block;
    width: 94%;
    margin: 0 auto;
  }
  .identity-barcode {
    display: block;
    /*
      A altura vem do aspect ratio do PNG gerado (module_width ajustado
      em services.py), não de um max-height artificial — mesmo raciocínio
      do layout de 100×50mm, só com o teto (`max-height`) reduzido para
      caber no canvas mais baixo.
    */
    width: 100%;
    height: auto;
    max-height: 8mm;
    object-fit: contain;
    image-rendering: pixelated;
  }

  /*
    Tema DARK (pedido de 04/09/2026 — modal LIGHT/DARK antes do download
    em lote). Mesma estrutura da etiqueta de sempre — só troca claro↔escuro
    na área de patrimônio/código de barras (`.identity-block`). Tudo
    abaixo só se aplica quando `theme == "dark"` (classe `theme-dark` no
    <body>) — sem essa classe, o tema LIGHT (padrão) não sofre nenhuma
    mudança de aparência por causa desta regra.

    `.brand-block` já é preto em QUALQUER tema — não precisa de regra
    extra aqui. `.qr-half` também já é branco fixo em qualquer tema
    (garantia de leitura do QR, pedido explícito) — também não muda. Só
    `.identity-barcode-wrap` recebe uma "ilha" branca no tema escuro,
    pelo mesmo motivo do QR: um código de barras preto sobre fundo escuro
    perderia contraste para o leitor.
  */
  body.theme-dark .identity-block {
    background: var(--locus-black);
  }
  body.theme-dark .identity-patrimonio {
    color: #fff;
  }
  body.theme-dark .identity-barcode-wrap {
    background: #fff;
    padding: 0.8mm 1.2mm;
    border-radius: 0.8mm;
  }
  .identity-patrimonio {
    /*
      Sem `white-space: nowrap`/`text-overflow: ellipsis` (diferente do
      layout de 100×50mm, que tinha largura de sobra): nos 30mm de
      largura da metade esquerda, truncar com reticências cortaria o
      patrimônio (prioridade 2, precisa continuar legível por inteiro) —
      como sobra bastante altura nesta área (auditado no PDF real), a
      quebra em até 2 linhas mantém o texto completo sem espremer a
      fonte a ponto de ficar ilegível.
    */
    width: 100%;
    min-width: 0;
    font-size: 8.5pt;
    line-height: 1.15;
    font-weight: bold;
    color: #000;
    letter-spacing: 0.1pt;
    text-align: center;
    margin: 0.8mm 0 0 0;
    overflow-wrap: break-word;
  }

  /*
    Metade direita: só o QR Code, fundo branco puro, centralizado nos dois
    eixos, com margem (quiet zone visual) garantindo que não encoste nas
    bordas. Nenhum outro texto/elemento aqui.
  */
  .qr-half {
    width: 50%;
    height: 100%;
    background: #fff;
    border-left: 0.3mm dashed #9CA3AF;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2mm;
  }
  .qr-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
</style>
</head>
<body{% if theme == "dark" %} class="theme-dark"{% endif %}>
  {% for label in labels %}
  <div class="label">
    <div class="id-half">
      <div class="brand-block">
        <p class="brand-wordmark">LOCUS</p>
      </div>
      <div class="identity-block">
        <div class="identity-barcode-wrap">
          <img class="identity-barcode" src="{{ label.barcode_data_uri }}" alt="Código de barras {{ label.patrimonio }}">
        </div>
        <p class="identity-patrimonio">{{ label.patrimonio }}</p>
      </div>
    </div>
    <div class="qr-half">
      <img class="qr-image" src="{{ label.qr_data_uri }}" alt="QR Code {{ label.patrimonio }}">
    </div>
  </div>
  {% endfor %}
</body>
</html>
