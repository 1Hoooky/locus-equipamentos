# Produção — notebook Windows/WSL2 atrás de túnel reverso FRP + Oracle
# Cloud VPS (procedimento completo: docs/deploy-oracle-frp-notebook.md).
# Uso: docker compose up -d --build
#
# Pressupõe um .env real na raiz (nunca commitado — ver .env.example)
# com DJANGO_SETTINGS_MODULE=config.settings.prod.
#
# Arquitetura atual (04/09/2026 — substitui a hospedagem HostGator VPS
# original, ver docs/deploy-fase1.md para o histórico dessa decisão
# anterior):
#
#   Internet → HTTPS → Oracle Cloud VPS (Nginx público + Let's Encrypt)
#     → túnel reverso FRP → este host (notebook) → HTTP local
#     → Nginx deste Compose (serviço `nginx`, só porta 80)
#     → Gunicorn (serviço `web`) → PostgreSQL (serviço `db`)
#
# A Oracle é agora o ÚNICO ponto responsável por HTTPS público, emissão e
# renovação do certificado Let's Encrypt, e redirecionamento HTTP→HTTPS —
# por isso o Nginx abaixo não expõe mais a porta 443 nem monta volume
# nenhum de certificado (não há mais serviço `certbot` neste Compose; a
# emissão/renovação acontece inteiramente do lado da Oracle, fora deste
# repositório). Ver `docker/nginx.conf` para como o header
# `X-Forwarded-Proto` que a Oracle envia é repassado (nunca recalculado)
# até o Django.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - locus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Só HTTP local — o FRP client rodando no notebook encaminha para
      # esta porta; a Oracle é quem fala HTTPS com a internet. Nenhuma
      # porta 443 aqui (nenhum certificado é montado/servido por este
      # Nginx).
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  locus_db_data:
  static_volume:
  media_volume:
